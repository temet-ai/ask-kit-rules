id = "temet.rules"
name = "rules"
version = "0.1.0"
min_ask_kit = "0.2.0"
requires = ["rg"]
says = "the standing instructions Claude Code sessions work under, and consolidating them: what rule or lesson exists about a subject and which file holds it (CLAUDE.md, AGENTS.md, ~/.claude/rules, a repository's .claude/rules, the memory folder), everything that loads for a folder and how big it is, how many rules there are, which rules duplicate or contradict each other, which are stale (they name a file, command, skill or date that is gone), whether the memory index is up to date; and acting on it (merge duplicates, shorten, move or delete a rule, write a new rule or memory in the right place and format)"
keywords = ["rules?", "CLAUDE\\.md", "AGENTS\\.md", "claude\\.local\\.md", "memory", "MEMORY\\.md", "lessons?", "instructions?", "\\.claude/rules", "stale rules?", "duplicate rules?", "contradict\\w*", "consolidate", "rule set", "timebombs?"]
route_hint = "the standing instruction files (CLAUDE.md, AGENTS.md, rules folders, auto-memory, a repository's mike-lessons.md) and consolidating them are rules; how mike stores a lesson, and what a session was told or did, are mike (a change to a lesson goes through mike, never by editing mike-lessons.md); skills and agents are the skills kit; how Claude Code loads memory in general is claude-code-docs; a repository's own code or config is code"
cite = "`path:line` and the scope (user, project, parent, nested, memory, generated)"
instructions = "instructions.md"
acts = ["rules.edit", "rules.write", "rules.remove", "rules.remember", "rules.forget"]

[[settings]]
key = "REMOTE_WORDS"
about = "comma-separated words (host names, machine nicknames) that mark a rule as talking about another machine: a path it names that is missing here is then reported with low confidence"
default = "ssh,remote,server,vps"

[[sources]]
kind = "module"
name = "rules"
module = "rules.mjs"
api = "api.d.ts"

[[roles]]
name = "finder"
when = "a question about what rule, memory or lesson exists about something, where it lives, how many there are, how big the loaded set is, or whether any are stale, duplicated or contradictory"
patterns = ["\\b(what|which|where|how many|any)\\b.*\\b(rules?|lessons?|memor(y|ies)|CLAUDE\\.md|AGENTS\\.md|instructions?)\\b"]
instructions = "roles/finder.md"

[[roles]]
name = "consolidator"
when = "a request to merge, shorten, tidy, move, delete or reduce rules, memories or instruction files, or to write a new rule or memory"
patterns = ["\\b(merge|consolidate|tidy|shorten|trim|dedupe|clean ?up|reduce|prune|retire|remove|delete|add|write|record)\\b.*\\b(rules?|memor(y|ies)|CLAUDE\\.md|AGENTS\\.md)\\b"]
instructions = "roles/consolidator.md"
